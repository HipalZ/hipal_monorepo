apiVersion: skaffold/v2alpha3
kind: Config
deploy:
  kubectl:
    manifests:
      - ./infra/k8s/local/*
build:
  local:
    push: false
  artifacts:
    - image: hipal/users
      context: servers/users
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "/**/*.ts"
            dest: .
    - image: hipal/businesses
      context: servers/businesses
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "/**/*.ts"
            dest: .
    - image: hipal/categories
      context: servers/categories
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "/**/*.ts"
            dest: .
    - image: hipal/dishes
      context: servers/dishes
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "/**/*.ts"
            dest: .
    - image: hipal/client-biz
      context: clients/client
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "**/*.js"
            dest: .
          - src: "**/*.ts"
            dest: .
          - src: "**/*.vue"
            dest: .
    - image: hipal/client-admin
      context: clients/client-admin
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "**/*.js"
            dest: .
          - src: "**/*.ts"
            dest: .
          - src: "**/*.vue"
            dest: .
    - image: hipal/storage
      context: servers/storage
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "/**/*.ts"
            dest: .
