apiVersion: skaffold/v2alpha3
kind: Config
deploy:
  kubectl:
    manifests:
      - ./infra/k8s/local/*
build:
  local:
    push: false
  artifacts:
    - image: hipal/users
      context: users
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "/**/*.ts"
            dest: .
    - image: hipal/businesses
      context: businesses
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "/**/*.ts"
            dest: .
    - image: hipal/categories
      context: categories
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "/**/*.ts"
            dest: .
    - image: hipal/dishes
      context: dishes
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "/**/*.ts"
            dest: .
    - image: hipal/client-biz
      context: client
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "**/*.js"
            dest: .
          - src: "**/*.ts"
            dest: .
          - src: "**/*.vue"
            dest: .
    - image: hipal/client-admin
      context: client-admin
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "**/*.js"
            dest: .
          - src: "**/*.ts"
            dest: .
          - src: "**/*.vue"
            dest: .
    - image: hipal/storage
      context: storage
      docker:
        dockerfile: Dockerfile
      sync:
