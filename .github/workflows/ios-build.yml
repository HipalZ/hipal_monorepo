name: Build iOS App

on:
  push:
    branches:
      - test
      - main
    paths:
      - 'clients/client-hitable-react/**'
  workflow_dispatch:

jobs:
  build_ios:
    name: Build iOS IPA
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./clients/client-hitable-react

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install Dependencies
        # Installing dependencies in the root might be needed for workspace, but we'll try client scope first.
        # Often in monorepos, we need to install from root.
        run: |
          cd ../..
          pnpm install --frozen-lockfile
          
      - name: Build Web Assets
        run: pnpm run build

      - name: Add iOS Platform & Sync
        # We run add ios again just in case, though it should be in repo now.
        # If it exists, cap add might fail or warn. We can skip add if ios folder exists.
        run: |
          npx cap sync ios

      - name: Setup Certificate and Provisioning Profile
        # Only runs if secrets are present
        if: secrets.BUILD_CERTIFICATE_BASE64 != ''
        run: |
          # Create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Import certificate and provision
          echo -n "${{ secrets.BUILD_CERTIFICATE_BASE64 }}" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}" | base64 --decode -o $PP_PATH

          # Create temporary keychain
          security create-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" $KEYCHAIN_PATH

          # Import certificate to keychain
          security import $CERTIFICATE_PATH -P "${{ secrets.P12_PASSWORD }}" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Apply provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Build and Archive
        # Only runs if secrets are present to avoid failure on unsigned build attempt 
        # (Though we could do unsigned build for simulator if needed, user wants download)
        if: secrets.BUILD_CERTIFICATE_BASE64 != ''
        run: |
          cd ios
          xcodebuild -workspace App/App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $PWD/build/App.xcarchive \
            clean archive \
            CODE_SIGN_STYLE="Manual" \
            PROVISIONING_PROFILE_SPECIFIER=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i $RUNNER_TEMP/build_pp.mobileprovision)) \
            CODE_SIGN_IDENTITY="iPhone Distribution"

      - name: Export .ipa
        if: secrets.BUILD_CERTIFICATE_BASE64 != ''
        run: |
          cd ios
          xcodebuild -exportArchive \
            -archivePath $PWD/build/App.xcarchive \
            -exportOptionsPlist App/App/ExportOptions.plist \
            -exportPath $PWD/build

      - name: Upload IPA Artifact
        if: secrets.BUILD_CERTIFICATE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: clients/client-hitable-react/ios/build/*.ipa
