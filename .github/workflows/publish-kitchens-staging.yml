name: Build and Push kitchens Server Image

on:
  push:
    branches: ['test']
    paths:
      - 'Dockerfile'
      - 'package.json'
      - 'servers/kitchens/**'

env:
  DIGITALOCEAN_REGISTRY: registry.digitalocean.com/hipalz-repo
  DOCKER_REPOSITORY: kitchens-test-server

jobs:
  build-and-push:
    name: Build and Push to DigitalOcean Container Registry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to DigitalOcean Container Registry
        run: echo "${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}" | docker login ${{ env.DIGITALOCEAN_REGISTRY }} -u doctl --password-stdin

      - name: Build, tag, and push image to DigitalOcean Container Registry
        run: |
          IMAGE_TAG=latest
          docker build --target kitchens-server -t ${{ env.DIGITALOCEAN_REGISTRY }}/$DOCKER_REPOSITORY:$IMAGE_TAG .
          docker push ${{ env.DIGITALOCEAN_REGISTRY }}/$DOCKER_REPOSITORY:$IMAGE_TAG

      - name: Set up kubectl
        uses: azure/setup-kubectl@v1
        with:
          version: 'v1.22.0'

      - name: Configure DigitalOcean kubeconfig
        run: doctl kubernetes cluster kubeconfig save ${{secrets.TEST_CLUSTER_ID}}
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Restart deployment
        run: kubectl rollout restart deployment kitchens-test-server -n hipalz
