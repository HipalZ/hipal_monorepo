name: Build and Push hipal

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_HIPALZ_PROJECT_ID }}

on:
  push:
    branches: ['test']
    paths:
      - 'package.json'
      - '*'

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    # outputs:
    #   deployment-url: ${{ steps.vercel.outputs.deployment-url }}

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - uses: pnpm/action-setup@v2.0.1
        with:
          version: 7.20.0

      - name: Setup Node.js environment
        uses: actions/setup-node@v3
        with:
          always-auth: true
          node-version: 18

      - name: Install dependencies
        run: pnpm install

      - name: Install Vercel CLI
        run: npm install --global vercel@33.2.0

      - name: Pull Vercel Environment Information
        run: cd clients/client-hipal-app && vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }} && vercel build --prod --token=${{ secrets.VERCEL_TOKEN }} && cd ../../ && rm pnpm-lock.yaml && pnpm install && cd clients/client-hipal-app  && vercel deploy --no-wait --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      # - name: Build Project Artifacts
      #   run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # - name: Deploy Project Artifacts to Vercel
      #   id: vercel
      #   run: |
      #     echo "::set-output name=deployment-url::$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} | tail -n 1)"
