name: CI
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_HIPALZ_PROJECT_ID: ${{ secrets.VERCEL_HIPALZ_PROJECT_ID }}
on:
  push:
    branches: ['test']
    paths:
      - 'clients/client-hipal-app/**'

jobs:
  build:
    name: Build and Test
    timeout-minutes: 15
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.vercel.outputs.deployment-url }}
    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v2.0.1
        with:
          version: 7.20.0

      - name: Setup Node.js environment
        uses: actions/setup-node@v3
        with:
          always-auth: true
          node-version: 18
          # cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # - name: Build
      #   run: pnpm build

      - name: Install Vercel CLI
        run: npm install --global vercel@canary

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        id: vercel
        run: |
          # vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
          echo "::set-output name=deployment-url::$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} | tail -n 1)"
          # echo "deployment-url=hello" >> $GITHUB_OUTPUT
