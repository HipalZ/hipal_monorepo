apiVersion: apps/v1
kind: Deployment
metadata:
  name: reviews-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reviews
  template:
    metadata:
      labels:
        app: reviews
    spec:
      containers:
        - name: reviews
          image: 750521980800.dkr.ecr.ap-south-1.amazonaws.com/hipal-reviews-staging:latest
          env:
            - name: NODE_ENV
              value: production
            - name: NODE_OPTIONS
              value: '--unhandled-rejections=strict'
            - name: NATS_CLIENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NATS_URL
              value: 'http://nats-srv:4222'
            - name: NATS_CLUSTER_ID
              value: hipal
            - name: MONGO_URI
              value: 'mongodb://reviews-mongo-srv:27017/reviews'
            - name: REDIS_HOST
              value: reviews-redis-srv
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_KEY
          resources:
            requests:
              cpu: '100m'
              memory: '100Mi'
            limits:
              cpu: 1000m
              memory: 1000Mi
---
apiVersion: v1
kind: Service
metadata:
  name: reviews-srv
spec:
  selector:
    app: reviews
  ports:
    - name: reviews
      protocol: TCP
      port: 3000
      targetPort: 3000
