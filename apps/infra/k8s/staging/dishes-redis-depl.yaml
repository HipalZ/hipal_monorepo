apiVersion: apps/v1
kind: Deployment
metadata:
  name: dishes-redis-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dishes-redis
  template:
    metadata:
      labels:
        app: dishes-redis
    spec:
      containers:
      - name: dishes-redis
        image: redis
        resources:
            requests:
              cpu: '100m'
              memory: '100Mi'
            limits:
              cpu: 100m
              memory: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dishes-redis-srv
spec:
  selector:
    app: dishes-redis
  ports:
    - name: db
      protocol: TCP
      port: 6379
      targetPort: 6379