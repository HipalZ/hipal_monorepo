apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production-hitable
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: support@hipal.life
    privateKeySecretRef:
      name: letsencrypt-production-hitable
    solvers:
      - http01:
          ingress:
            class: nginx
