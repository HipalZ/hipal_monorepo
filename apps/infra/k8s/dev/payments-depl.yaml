apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      hostAliases:
        - ip: "192.168.1.13"
          hostnames:
          - "biz.hipal.life"
          - "api.hipal.life"
          - "storage.hipal.life"
      containers:
        - name: payments
          image: hipal/payments
          env:
            - name: NODE_ENV
              value: development
            - name: NODE_OPTIONS
              value: '--unhandled-rejections=strict'
            - name: NATS_CLIENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NATS_URL
              value: 'http://nats-srv:4222'
            - name: NATS_CLUSTER_ID
              value: hipal
            - name: MONGO_URI
              value: 'mongodb://payments-mongo-srv:27017/payments'
            - name: REDIS_HOST
              value: payments-redis-srv
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_KEY
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: onepay-api-key
                  key: API_KEY
            - name: MERCHANT_ID
              valueFrom:
                secretKeyRef:
                  name: onepay-merchant-id
                  key: MERCHANT_ID
            - name: RESELLER_ID
              valueFrom:
                secretKeyRef:
                  name: onepay-reseller-id
                  key: RESELLER_ID
          resources:
            requests:
              cpu: '100m'
              memory: '100Mi'
            limits:
              cpu: 1000m
              memory: 1000Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payments-srv
spec:
  selector:
    app: payments
  ports:
    - name: payments
      protocol: TCP
      port: 3000
      targetPort: 3000
