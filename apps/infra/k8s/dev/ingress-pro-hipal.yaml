apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-pro-hipal-service
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-production-pro-hipal"
spec:
  tls:
    - hosts:
        - dev.pro.hipal.life
      secretName: letsencrypt-production-pro-hipal
  rules:
    - host: dev.pro.hipal.life
      http:
        paths:
          - path: /?(.*)
            pathType: Prefix
            backend:
              service:
                name: client-pro-hipal-srv
                port:
                  number: 3000
