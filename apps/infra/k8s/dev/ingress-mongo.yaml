apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-biz-service
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/use-regex: 'true'
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-production-biz"
spec:
  tls:
    - hosts:
      - mongo-business.hipal.life
      secretName: letsencrypt-production-biz
  rules:
    - host: mongo-business.hipal.life
      http:
        paths:
          - path: /?(.*)
            pathType: Prefix
            backend:
              service:
                name: businesses-mongo-srv
                port:
                  number: 27017
