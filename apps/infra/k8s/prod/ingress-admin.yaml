apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-admin-service
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/use-regex: 'true'
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-production-admin"
spec:
  tls:
    - hosts:
      - admin.hipal.life
      secretName: letsencrypt-production-admin
  rules:
    - host: admin.hipal.life
      http:
        paths:
          - path: /?(.*)
            pathType: Prefix
            backend:
              service:
                name: client-admin-srv
                port:
                  number: 3000
