apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # This name uniquely identifies the PVC. Will be used in deployment below.
  name: kitchens-mongo-claim
  labels:
    app: kitchens-storage-claim
spec:
  # Read more about access modes here: http://kubernetes.io/docs/user-guide/persistent-volumes/#access-modes
  accessModes:
    - ReadWriteOnce
  storageClassName: gp2
  resources:
    # This is the request for storage. Should be available in the cluster.
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kitchens-mongo-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kitchens-mongo
  template:
    metadata:
      labels:
        app: kitchens-mongo
    spec:
      volumes:
        - name: kitchens-mongo-storage
          persistentVolumeClaim:
            claimName: kitchens-mongo-claim
      containers:
      - name: kitchens-mongo
        image: mongo:6.0.3
        volumeMounts:
          - mountPath: /data/db
            name: kitchens-mongo-storage
        resources:
            requests:
              cpu: '100m'
              memory: '100Mi'
            limits:
              cpu: 1000m
              memory: 1000Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kitchens-mongo-srv
spec:
  selector:
    app: kitchens-mongo
  ports:
    - name: db
      protocol: TCP
      port: 27017
      targetPort: 27017
