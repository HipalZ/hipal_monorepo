apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-minio
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/upstream-vhost: "minio-service:9000"
    cert-manager.io/cluster-issuer: "letsencrypt-production-storage"
spec:
  tls:
    - hosts:
      - storage.hipal.life
      secretName: letsencrypt-production-storage
  rules:
    - host: storage.hipal.life
      http:
        paths:
          - path: /minio/?(.*)
            pathType: Prefix
            backend:
              service:
                name: minio-service
                port:
                  number: 9000
    - host: dashboard.hipal.life
      http:
        paths:
          - path: /?(.*)
            pathType: Prefix
            backend:
              service:
                name: minio-service
                port:
                  number: 9001
