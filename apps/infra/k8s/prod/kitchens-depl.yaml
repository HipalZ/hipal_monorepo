apiVersion: apps/v1
kind: Deployment
metadata:
  name: kitchens-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kitchens
  template:
    metadata:
      labels:
        app: kitchens
    spec:
      containers:
        - name: kitchens
          image: 750521980800.dkr.ecr.ap-south-1.amazonaws.com/hipal-kitchens:latest
          env:
            - name: CORS_ORIGINS
              value: "https://hitable.hipal.life,https://hikitchen.hipal.life,https://hibiz.hipal.life,https://pro.hipal.life,https://biz.hipal.life,https://admin.hipal.life,https://api.hipal.life,https://storage.hipal.life,https://dev.hipal.life,https://hipal.life,https://www.hipal.life,http://localhost:3000,https://dev.pro.hipal.life,https://dev.hitable.hipal.life,https://dev.hikitchen.hipal.life,https://dev.hibiz.hipal.life"
            - name: URL
              value: "https://api.hipal.life"
            - name: NODE_ENV
              value: production
            - name: NODE_OPTIONS
              value: "--unhandled-rejections=strict"
            - name: NATS_CLIENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NATS_URL
              value: "http://nats-srv:4222"
            - name: NATS_CLUSTER_ID
              value: hipal
            - name: MONGO_URI
              value: "mongodb://kitchens-mongo-srv:27017/kitchens"
            - name: REDIS_HOST
              value: kitchens-redis-srv
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_KEY
            - name: RAZORPAY_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: razorpay-key-id
                  key: RAZORPAY_KEY_ID
            - name: RAZORPAY_SECRET
              valueFrom:
                secretKeyRef:
                  name: razorpay-secret
                  key: RAZORPAY_SECRET
            - name: RAZORPAY_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: razorpay-webhook-secret
                  key: RAZORPAY_WEBHOOK_SECRET
          resources:
            requests:
              cpu: "100m"
              memory: "100Mi"
            limits:
              cpu: 1000m
              memory: 1000Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kitchens-srv
spec:
  selector:
    app: kitchens
  ports:
    - name: kitchens
      protocol: TCP
      port: 3000
      targetPort: 3000
