apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-biz-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client-biz
  template:
    metadata:
      labels:
        app: client-biz
    spec:
      hostAliases:
        - ip: "192.168.1.5"
          hostnames:
            - "dev.biz.hipal.life"
            - "dev.api.hipal.life"
            - "dev.storage.hipal.life"
      containers:
        - name: client-biz
          image: hipal/client-biz
          env:
            - name: NODE_ENV
              value: development
            - name: API_HOST
              value: "https://dev.api.hipal.life"
          # resources:
          #   limits:
          #     cpu: 2000m
          #     memory: 2000Mi
---
apiVersion: v1
kind: Service
metadata:
  name: client-biz-srv
spec:
  selector:
    app: client-biz
  ports:
    - name: client-biz
      protocol: TCP
      port: 3000
      targetPort: 3000
