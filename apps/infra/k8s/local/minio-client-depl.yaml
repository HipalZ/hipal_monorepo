apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storage
  template:
    metadata:
      labels:
        app: storage
    spec:
      hostAliases:
        - ip: "192.168.1.5"
          hostnames:
            - "biz.hipal.life"
            - "api.hipal.life"
            - "storage.hipal.life"
      containers:
        - name: storage
          image: hipal/storage
          env:
            - name: CORS_ORIGINS
              value: "https://dev.hitable.hipal.life,https://dev.hikitchen.hipal.life,https://dev.hibiz.hipal.life,https://dev.pro.hipal.life,https://dev.biz.hipal.life,https://dev.admin.hipal.life"
            - name: NODE_ENV
              value: development
            - name: NODE_OPTIONS
              value: "--unhandled-rejections=strict"
            - name: NATS_CLIENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NATS_URL
              value: "http://nats-srv:4222"
            - name: NATS_CLUSTER_ID
              value: hipal
            - name: MONGO_URI
              value: "mongodb://minio-client-mongo-srv:27017/minio-client"
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_KEY
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: 1000m
              memory: 1000Mi
---
apiVersion: v1
kind: Service
metadata:
  name: storage-srv
spec:
  selector:
    app: storage
  ports:
    - name: storage
      protocol: TCP
      port: 3000
      targetPort: 3000
