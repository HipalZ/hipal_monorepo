apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-hi-biz-service
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-production-hi-biz"
spec:
  tls:
    - hosts:
        - dev.hibiz.hipal.life
      secretName: letsencrypt-production-hi-biz
  rules:
    - host: dev.hibiz.hipal.life
      http:
        paths:
          - path: /?(.*)
            pathType: Prefix
            backend:
              service:
                name: client-hi-biz-srv
                port:
                  number: 3000
