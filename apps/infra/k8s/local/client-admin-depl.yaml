apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-admin-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client-admin
  template:
    metadata:
      labels:
        app: client-admin
    spec:
      hostAliases:
        - ip: "192.168.1.5"
          hostnames:
            - "admin.hipal.life"
            - "api.hipal.life"
            - "biz.hipal.life"
            - "storage.hipal.life"
      containers:
        - name: client-admin
          image: hipal/client-admin
          env:
            - name: NODE_ENV
              value: development
            - name: API_HOST
              value: https://dev.api.hipal.life
          # resources:
          #   limits:
          #     cpu: 2000m
          #     memory: 2000Mi
---
apiVersion: v1
kind: Service
metadata:
  name: client-admin-srv
spec:
  selector:
    app: client-admin
  ports:
    - name: client-admin
      protocol: TCP
      port: 3000
      targetPort: 3000
