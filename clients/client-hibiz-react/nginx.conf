server {

    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints every bundle, so a given filename never changes contents
    # and a new deploy emits new names. Safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The shell is the one file that keeps its name across deploys, and it is
    # what points at the fingerprinted bundles. With no Cache-Control at all,
    # browsers fall back to heuristic freshness and can hold a stale index.html
    # for hours — pinning the user to the previous deploy's JS, so new routes
    # look missing even after a hard refresh.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

}
