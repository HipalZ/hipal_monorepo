server {

    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints every bundle, so a given filename never changes contents
    # and a new deploy emits new names. Safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The shell keeps its name across deploys and is what points at the
    # fingerprinted bundles. With no Cache-Control at all, browsers fall back to
    # heuristic freshness and can pin themselves to the previous deploy's JS.
    #
    # This matters more here than on the dashboard: the iOS and Android apps
    # load this origin remotely rather than bundling dist/, so a cached shell
    # means an over-the-air fix never reaches an installed app.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

}
