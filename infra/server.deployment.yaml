---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-test
  namespace: hipalz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server-test
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: server-test
    spec:
      containers:
        - name: server-test
          image: registry.digitalocean.com/hipalz-repo/server-test:latest
          imagePullPolicy: Always
          # imagePullSecrets: hipalz-repo
          ports:
            - name: http
              containerPort: 4500
