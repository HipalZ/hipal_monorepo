---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-production
  namespace: hipalz
spec:
  replicas: 2
  selector:
    matchLabels:
      app: server-production
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: server-production
    spec:
      containers:
        - name: server-production
          image: registry.digitalocean.com/hipalz-repo/server-production:latest
          imagePullPolicy: Always
          # imagePullSecrets: hipalz-repo
          ports:
            - name: http
              containerPort: 4500
