---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dishes-server-test
  namespace: hipalz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dishes-server-test
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: dishes-server-test
    spec:
      containers:
        - name: dishes-server-test
          image: registry.digitalocean.com/hipalz-repo/dishes-test-server:latest
          imagePullPolicy: Always
          # imagePullSecrets: hipalz-repo
          ports:
            - name: http
              containerPort: 4500

