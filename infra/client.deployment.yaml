---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-hitable-production
  namespace: hipalz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client-hitable-production
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: client-hitable-production
    spec:
      containers:
        - name: client-hitable-production
          image: registry.digitalocean.com/hipalz-repo/client-hitable-production:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 100Mi
            limits:
              cpu: 200m
              memory: 100Mi

