---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client_hitable_test
  namespace: hipalz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client_hitable_test
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: client_hitable_test
    spec:
      containers:
        - name: client_hitable_test
          image: registry.digitalocean.com/hipalz-repo/client_hitable_test:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 100Mi
            limits:
              cpu: 200m
              memory: 100Mi

