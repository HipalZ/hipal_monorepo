apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-hipalz
  namespace: hipalz
  annotations:
    nginx.ingress.kubernetes.io/use-regex: 'true'
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    cert-manager.io/issuer: letsencrypt-nginx-wcard
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/enable-cors: 'true'
    nginx.ingress.kubernetes.io/cors-allow-origin: 'https://table.test.hipalz.com, https://biz.test.hipalz.com, https://kitchen.test.hipalz.com, http://localhost:3000, http://localhost:3001, http://localhost:3002, http://localhost:3003, http://localhost:3004'
    nginx.ingress.kubernetes.io/cors-allow-headers: Content-Type, Authorization, x-refresh-with, h-idem-id
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.test.hipalz.com
      secretName: test.hipalz.com
  rules:
    - host: api.test.hipalz.com
      http:
        paths:
          - path: /v1/users/?(.*)
            pathType: Prefix
            backend:
              service:
                name: users-server-test
                port:
                  number: 80
          - path: /v1/businesses/?(.*)
            pathType: Prefix
            backend:
              service:
                name: businesses-server-test
                port:
                  number: 80
          - path: /v1/categories/?(.*)
            pathType: Prefix
            backend:
              service:
                name: categories-server-test
                port:
                  number: 80
          - path: /v1/dishes/?(.*)
            pathType: Prefix
            backend:
              service:
                name: dishes-server-test
                port:
                  number: 80
          - path: /v1/settings/?(.*)
            pathType: Prefix
            backend:
              service:
                name: settings-server-test
                port:
                  number: 80
          - path: /v1/kitchens/?(.*)
            pathType: Prefix
            backend:
              service:
                name: kitchens-server-test
                port:
                  number: 80
          - path: /v1/zones/?(.*)
            pathType: Prefix
            backend:
              service:
                name: zones-server-test
                port:
                  number: 80
          - path: /v1/payments/?(.*)
            pathType: Prefix
            backend:
              service:
                name: payments-server-test
                port:
                  number: 80
    - host: table.test.hipalz.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client-hitable-test
                port:
                  number: 80
    - host: kitchen.test.hipalz.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client-hikitchen-test
                port:
                  number: 80
    - host: biz.test.hipalz.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client-hibiz-test
                port:
                  number: 80
