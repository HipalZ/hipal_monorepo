apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-hipalz
  namespace: hipalz
  annotations:
    nginx.ingress.kubernetes.io/use-regex: 'true'
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    cert-manager.io/issuer: letsencrypt-nginx-wcard
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.test.hipalz.com
      secretName: test.hipalz.com
  rules:
    - host: api.test.hipalz.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: server-test
                port:
                  number: 80

    - host: table.test.hipalz.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client-hitable-test
                port:
                  number: 80

    - host: biz.test.hipalz.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client-hibiz-test
                port:
                  number: 80
