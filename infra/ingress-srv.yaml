apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-hipalz
  namespace: hipalz
  annotations:
    nginx.ingress.kubernetes.io/use-regex: 'true'
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    cert-manager.io/issuer: letsencrypt-nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dev.api.hipalz.com
        - dev.hiclient.hipalz.com
        - dev.hibiz.hipalz.com
      secretName: letsencrypt-nginx
  rules:
    - host: dev.api.hipalz.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: server-test
                port:
                  number: 80

    - host: dev.hiclient.hipalz.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client_hitable_test
                port:
                  number: 80

    - host: dev.hibiz.hipalz.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client_hibiz_test
                port:
                  number: 80
